# rvl-sbqr-mocks — local orchestration for the mock services.
#
# fi-idp-mock runs one instance per FI (same image, different env):
#   - fi-idp-dhakabank  :5105  issuer http://localhost:5105
#   - fi-idp-ebl        :5106  issuer http://localhost:5106
#
# sbqr-api-mock is the spec-conformant upstream stand-in (BanglaQR P2P,
# Ed25519-signed payloads, full verdict vocabulary) on :5201. A
# containerised BFF must point Platform__BaseUrl at
# http://sbqr-api-mock:5201; a host-run BFF keeps http://localhost:5201.
#
# NOTE: the BFF (rvl-sbqr-fi-gateway) validates a single issuer, so each
# FI needs its own BFF pointed at that FI's IdP:
#   Auth__Authority=http://localhost:5105 Auth__Issuer=http://localhost:5105 ...
#
# ext-bank-mock is the external (non-tenant) bank stand-in on :5205 — its
# QRs verify on the platform purely from the admin-seeded trust-directory
# public key (Option A: docs/external-bank-mock-option-a.md).
#
# bb-trust-store-mock and hsm-mock are still scaffolding (FROM scratch
# placeholders) — uncomment their sections once implemented.
#
# Usage:
#   docker compose up --build

services:
  fi-idp-dhakabank:
    build:
      context: ./services/fi-idp-mock
      dockerfile: Dockerfile
    container_name: sbqr-mocks-idp-dhakabank
    environment:
      PORT: "5105"
      FI_ID: dhakabank
      FI_NAME: Dhaka Bank
      # Host-reachable issuer (emulator + host-run BFF use localhost).
      # A containerised BFF must use http://fi-idp-dhakabank:5105 instead.
      ISSUER: http://localhost:5105
      AUDIENCE: sbqr-fi-gateway
    ports:
      - "5105:5105"
    restart: unless-stopped

  fi-idp-ebl:
    build:
      context: ./services/fi-idp-mock
      dockerfile: Dockerfile
    container_name: sbqr-mocks-idp-ebl
    environment:
      PORT: "5106"
      FI_ID: ebl
      FI_NAME: Eastern Bank
      ISSUER: http://localhost:5106
      AUDIENCE: sbqr-fi-gateway
    ports:
      - "5106:5106"
    restart: unless-stopped

  # sbqr-api-mock — spec-conformant upstream stand-in (BanglaQR P2P,
  # Ed25519-signed). Containerised BFFs must point
  # Platform__BaseUrl at http://sbqr-api-mock:5201 instead of localhost.
  # sbqr-api-mock:
  #   build:
  #     context: ./services/sbqr-api-mock
  #     dockerfile: Dockerfile
  #   container_name: sbqr-mocks-sbqr-api
  #   environment:
  #     PORT: "5201"
  #     INSTITUTION: "000085"
  #   ports:
  #     - "5201:5201"
  #   restart: unless-stopped

  # ext-bank-mock — external (non-tenant) bank stand-in, Option A zero
  # migration (workspace doc: docs/external-bank-mock-option-a.md).
  # Owns its Ed25519 keypair; an admin seeds the public key via
  # POST /v1/admin/institutions and the platform's unchanged verify path
  # accepts its QRs. The volume keeps the private key stable across
  # restarts/rebuilds (a fresh key would orphan the registered public key).
  ext-bank-mock:
    build:
      context: ./services/external-bank-mock
      dockerfile: Dockerfile
    container_name: sbqr-mocks-ext-bank
    environment:
      PORT: "5205"
      BANK_ID: shapla
      BANK_NAME: "Shapla Commercial Bank PLC"
      BANK_TAGLINE: "Banking for every rhythm of life"
      BANK_PRODUCT: "Shapla Pay"
      # 6-digit Institution_ID = type 03 + reserved 99xx institution code.
      INSTITUTION_ID: "039999"
      PRIVATE_KEY_PEM_PATH: /keys/ed25519-private.pem
    volumes:
      - ext-bank-keys:/keys
    ports:
      - "5205:5205"
    restart: unless-stopped

  # bb-trust-store-mock:
  #   build:
  #     context: ./services/bb-trust-store-mock
  #     dockerfile: Dockerfile
  #   # TODO: wire up when bb-trust-store-mock is implemented.
  #
  # hsm-mock:
  #   build:
  #     context: ./services/hsm-mock
  #     dockerfile: Dockerfile
  #   # TODO: wire up when hsm-mock is implemented.

volumes:
  ext-bank-keys:
